services:
  db:
    image: postgres:16.4
    container_name: psg-inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: psg_inventory
    ports:
      - '5432:5432'
    volumes:
      - psg-inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  psg-inventory-db-data:
