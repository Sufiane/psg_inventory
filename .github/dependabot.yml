version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      versioning-strategy: increase
      commit-message:
          prefix: 'chore(deps)'
      groups:
          root-minor-patch:
              update-types:
                  - minor
                  - patch

    - package-ecosystem: npm
      directory: /web
      schedule:
          interval: weekly
      versioning-strategy: increase
      commit-message:
          prefix: 'chore(deps)'
      groups:
          web-minor-patch:
              update-types:
                  - minor
                  - patch

    - package-ecosystem: npm
      directory: /e2e
      schedule:
          interval: weekly
      versioning-strategy: increase
      commit-message:
          prefix: 'chore(deps)'
      groups:
          e2e-minor-patch:
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: 'ci(deps)'
      groups:
          github-actions:
              patterns:
                  - '*'
